<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel ="icon" type="image/png" href="task.png">
    <title>TAREFA!</title>
</head>
<body>
    <h1>Bem-Vindo ao TAREFA!</h1>
    <div class = "painel">

    <div class="add">
        <p>Adicionar tarefas na lista:</p>
        <button type="button">➕ Adicionar</button>
    </div>
    <br>
    <div class="view">
        <p>Visualizar sua lista momentaneamente:</p>
        <button type="button">👁️ Visualizar</button>
        <ul id="lista-tarefas"></ul>
    </div>
        <br>
    <div class="complete">
        <p>Concluir tarefas da lista:</p>
        <button type="button">✅ Concluir</button>
    </div>
        <br>
    <div class="remove">
        <p>Remover tarefas da lista:</p>
        <button type="button">🗑️ Remover</button>
    </div>
    <div\>
        <script src="script.js"></script>
</body>
</html>
